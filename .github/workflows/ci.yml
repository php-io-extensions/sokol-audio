name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: PHP ${{ matrix.php }} ${{ matrix.ts }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        php: ['8.4', '8.5']
        ts: [nts, zts]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
        env:
          phpts: ${{ matrix.ts == 'zts' && 'ts' || 'nts' }}

      - name: PipeWire
        # sokol-audio's Linux backend talks to a pulse server. PipeWire's, with a null sink, gives the
        # suite a real audio thread without a sound card. Not PulseAudio's null sink: sokol opens its
        # stream without asking for a latency, so that sink renders 2-second blocks and the stream
        # callback runs once every 2 s. PipeWire runs it every graph cycle, like the hardware does.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse-dev pipewire pipewire-pulse wireplumber pulseaudio-utils dbus
          if [ -z "${XDG_RUNTIME_DIR:-}" ] || [ ! -w "$XDG_RUNTIME_DIR" ]; then
            XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
            mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          fi
          export XDG_RUNTIME_DIR
          export DBUS_SESSION_BUS_ADDRESS="$(dbus-daemon --session --fork --print-address)"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          nohup pipewire > "$RUNNER_TEMP/pipewire.log" 2>&1 &
          sleep 1
          nohup wireplumber > "$RUNNER_TEMP/wireplumber.log" 2>&1 &
          nohup pipewire-pulse > "$RUNNER_TEMP/pipewire-pulse.log" 2>&1 &
          sleep 2
          pactl load-module module-null-sink sink_name=ci
          pactl set-default-sink ci
          pactl info

      - name: Build
        # sokol_audio.h is vendored under lib/sokol/ and compiled into the module.
        run: |
          phpize
          ./configure --enable-sokol-audio
          make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

      - name: Load
        run: |
          php -n -d extension="$PWD/modules/sokol_audio.so" -r 'exit(extension_loaded("sokol_audio") ? 0 : 1);'
          php -n -d extension="$PWD/modules/sokol_audio.so" --ri sokol_audio

      - name: Test
        # The lifecycle tests spawn child PHP processes, so the module is enabled through an extra
        # ini scan directory that every process inherits rather than a -d flag only the parent sees.
        # Tests that need an output device skip where sokol-audio cannot open one.
        run: |
          composer install --no-interaction --no-progress
          mkdir -p "$RUNNER_TEMP/php-ini"
          echo "extension=$PWD/modules/sokol_audio.so" > "$RUNNER_TEMP/php-ini/sokol_audio.ini"
          PHP_INI_SCAN_DIR=":$RUNNER_TEMP/php-ini" php -d memory_limit=128M vendor/bin/pest --ci

      - name: Test the audio thread logger
        # Kills the pulse server, so it runs last and alone.
        if: runner.os == 'Linux'
        run: |
          SAUDIO_TEST_KILL_PULSE=1 PHP_INI_SCAN_DIR=":$RUNNER_TEMP/php-ini" php -d memory_limit=128M vendor/bin/pest --ci --filter 'audio thread log'
